[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prii-maintenance"
version = "0.1.0"
description = "Shared deterministic, audit-first maintenance core for PRII producer repos."
# Matches the root repo's floor (`>=3.10`). UPGRADE_AUDIT.md DEP-3 (this floor
# being higher than the root's old `>=3.9`) closed when the root dropped 3.9.
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

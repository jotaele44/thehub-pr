[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "prii-desktop"
version = "0.4.0"
description = "Shared self-contained desktop runtime with native setup, repair, diagnostics, same-origin ASGI serving, and pywebview."
readme = "README.md"
# Matches the root repo's floor (`>=3.10`). UPGRADE_AUDIT.md DEP-3 (this floor
# being higher than the root's old `>=3.9`) closed when the root dropped 3.9.
requires-python = ">=3.10"
license = { text = "MIT" }
# No hard runtime deps: the desktop .venv already provides fastapi + uvicorn
# (server/backend/requirements.txt) and pywebview (requirements-desktop.txt).
# Those are imported lazily inside functions so importing this package is cheap.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

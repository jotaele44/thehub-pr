name: maintenance

# Audit-first federation maintenance. Runs the maintenance unit tests and a
# best-effort rollup over whatever producer checkouts are present. Never
# auto-commits; the rollup is uploaded as an artifact only.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC

# Least privilege: this workflow only reads the repo (and uploads artifacts,
# which uses the runtime token, not GITHUB_TOKEN). Widen deliberately if a
# step ever needs to write back.
permissions:
  contents: read

# Serialise runs on the same ref without cancelling. This workflow can
# publish, write data, or hand off to another repo, and killing it
# mid-flight risks leaving that work half-done.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the pin report can count how far each producer's
          # PRII_TEMPLATE_REF is behind main.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Maintenance unit tests
        run: python -m pytest tests/test_maintenance_schemas.py tests/test_maintenance_rollup.py tests/test_maintenance_gate.py tests/test_hub_cli_maintenance.py -q

      - name: Rollup (audit mode, non-failing)
        run: hub maintenance --root . --write-report --json || true

      # Advisory: producers' drift gates compare against their own pinned hub
      # commit, so lagging pins never fail anywhere. Surface them here instead.
      - name: Federation pin report (advisory)
        run: |
          python tools/federation_pin_report.py --out reports/federation_maintenance/pin_report.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
          lagging=$(python -c "import json; print(', '.join(json.load(open('reports/federation_maintenance/pin_report.json'))['lagging_desktop_producers']))")
          if [ -n "$lagging" ]; then
            echo "::warning::Desktop producers on an older prii-desktop than the template pins: $lagging"
          fi

      - name: Upload pin report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: federation-pin-report
          path: reports/federation_maintenance/pin_report.json
          if-no-files-found: ignore

      - name: Upload rollup
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: federation-maintenance-rollup
          path: reports/federation_maintenance/latest.json
          if-no-files-found: ignore

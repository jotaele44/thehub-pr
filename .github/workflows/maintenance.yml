name: maintenance

# Audit-first federation maintenance. Runs the maintenance unit tests and a
# best-effort rollup over whatever producer checkouts are present. Never
# auto-commits; the rollup is uploaded as an artifact only.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC

# Least privilege: this workflow only reads the repo (and uploads artifacts,
# which uses the runtime token, not GITHUB_TOKEN). Widen deliberately if a
# step ever needs to write back.
permissions:
  contents: read

# Serialise runs on the same ref without cancelling. This workflow can
# publish, write data, or hand off to another repo, and killing it
# mid-flight risks leaving that work half-done.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Maintenance unit tests
        run: python -m pytest tests/test_maintenance_schemas.py tests/test_maintenance_rollup.py tests/test_maintenance_gate.py tests/test_hub_cli_maintenance.py -q

      - name: Rollup (audit mode, non-failing)
        run: hub maintenance --root . --write-report --json || true

      - name: Upload rollup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: federation-maintenance-rollup
          path: reports/federation_maintenance/latest.json
          if-no-files-found: ignore

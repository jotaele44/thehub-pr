name: GIS live source certification

on:
  pull_request:
    paths:
      - 'server/frontend/src/gis/**'
      - 'server/frontend/src/pages/GISWorkspace.jsx'
      - 'scripts/gis_live_source_certification.py'
      - 'scripts/gis_browser_cors_cert.mjs'
      - '.github/workflows/gis-live-source-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Live authoritative source certification
        run: python scripts/gis_live_source_certification.py | tee gis-live-source-receipt.json
      - name: Upload live source receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gis-live-source-receipt
          path: gis-live-source-receipt.json

  browser-cors:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: server/frontend
        run: npm ci
      - name: Install Chromium
        working-directory: server/frontend
        run: npx playwright install --with-deps chromium
      - name: Browser-origin CORS certification
        working-directory: server/frontend
        run: node ../../scripts/gis_browser_cors_cert.mjs | tee ../../gis-browser-cors-receipt.json
      - name: Upload CORS receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gis-browser-cors-receipt
          path: gis-browser-cors-receipt.json

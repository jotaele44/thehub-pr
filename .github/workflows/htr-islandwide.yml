name: HTR island-wide bounded census

# This workflow hits mutable authoritative services. Run it only when a new
# source snapshot is intentionally requested. Ordinary HTR/v3 commits must
# reuse the previously frozen census artifacts instead of silently redownloading
# SIGE roads/dams.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install -q pytest

      - name: HTR focused regressions
        run: PYTHONPATH=src python -m pytest tests/test_htr.py -q

      - name: Execute bounded island-wide census
        run: PYTHONPATH=src python scripts/run_htr_islandwide.py --out artifacts/htr_islandwide

      - name: Adjudicate discovery-noise negatives
        run: python scripts/adjudicate_htr_census.py artifacts/htr_islandwide

      - name: Display census summaries
        if: always()
        run: |
          if [ -f artifacts/htr_islandwide/summary.json ]; then
            cat artifacts/htr_islandwide/summary.json
          fi
          if [ -f artifacts/htr_islandwide/candidate_adjudication_summary.json ]; then
            cat artifacts/htr_islandwide/candidate_adjudication_summary.json
          fi

      - name: Upload frozen census artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htr-islandwide-${{ github.sha }}
          path: artifacts/htr_islandwide
          if-no-files-found: error
          retention-days: 30

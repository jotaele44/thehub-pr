name: MCP Registry Validation

on:
  pull_request:
    paths:
      - "mcp/**"
      - "schemas/federation/**"
      - "tools/validate_mcp_*.py"
      - "tools/check_registry_drift.py"
      - "tests/test_mcp_*.py"
      - "tests/test_registry_drift.py"
      - ".github/workflows/mcp-registry-validation.yml"
  push:
    branches:
      - main
    paths:
      - "mcp/**"
      - "schemas/federation/**"
      - "tools/validate_mcp_*.py"
      - "tools/check_registry_drift.py"
      - "tests/test_mcp_*.py"
      - "tests/test_registry_drift.py"
      - ".github/workflows/mcp-registry-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install jsonschema pyyaml pytest
      - name: Validate MCP manifests
        run: python tools/validate_mcp_manifests.py
      - name: Validate MCP candidates
        run: python tools/validate_mcp_candidates.py
      - name: Check registry drift
        run: python tools/check_registry_drift.py
      - name: Run MCP registry tests
        run: >-
          pytest tests/test_mcp_manifest_schema.py tests/test_mcp_candidates.py
          tests/test_registry_drift.py

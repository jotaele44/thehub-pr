name: MCP Registry Validation

on:
  pull_request:
    paths:
      - "mcp/**"
      - "schemas/federation/**"
      - "tools/validate_mcp_*.py"
      - "tools/check_registry_drift.py"
      - "tests/test_mcp_*.py"
      - "tests/test_registry_drift.py"
      - ".github/workflows/mcp-registry-validation.yml"
  push:
    branches:
      - main
    paths:
      - "mcp/**"
      - "schemas/federation/**"
      - "tools/validate_mcp_*.py"
      - "tools/check_registry_drift.py"
      - "tests/test_mcp_*.py"
      - "tests/test_registry_drift.py"
      - ".github/workflows/mcp-registry-validation.yml"

permissions:
  contents: read

# Serialise runs on the same ref without cancelling. This workflow can
# publish, write data, or hand off to another repo, and killing it
# mid-flight risks leaving that work half-done.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install jsonschema pyyaml pytest
      - name: Validate MCP manifests
        run: python tools/validate_mcp_manifests.py
      - name: Validate MCP candidates
        run: python tools/validate_mcp_candidates.py
      - name: Check registry drift
        run: python tools/check_registry_drift.py
      - name: Run MCP registry tests
        run: >-
          pytest tests/test_mcp_manifest_schema.py tests/test_mcp_candidates.py
          tests/test_registry_drift.py

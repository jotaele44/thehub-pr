name: GUI capability parity

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      strict:
        description: Fail on all legacy GUI parity debt
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gui-capability-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Federation GUI Capability Parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run parity ratchet
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.strict }}
        run: >-
          python scripts/check_gui_parity.py
          --report artifacts/gui-parity-report.json
      - name: Run strict parity audit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.strict }}
        run: >-
          python scripts/check_gui_parity.py
          --strict
          --report artifacts/gui-parity-report.json
      - name: Test the parity validator
        if: always()
        run: python -m unittest tests/test_gui_parity.py
      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gui-parity-report
          path: artifacts/gui-parity-report.json
          if-no-files-found: warn
          retention-days: 30

  gui-reachability:
    name: GUI Reachability E2E
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:gui-parity
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gui-parity-browser-evidence
          path: |
            server/frontend/playwright-report
            server/frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

name: HTR v3 SIGE canal source acquisition

# Manual acquisition prevents unrelated PR commits from redownloading a mutable
# source whose successful snapshot is already frozen by artifact digest.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-canal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Freeze bounded SIGE canal denominator
        run: python scripts/freeze_htr_v3_canal_denominator.py --out artifacts/htr_v3_canal
      - name: Display summary
        if: always()
        run: |
          if [ -f artifacts/htr_v3_canal/summary.json ]; then
            cat artifacts/htr_v3_canal/summary.json
          fi
      - name: Upload frozen canal denominator
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htr-v3-canal-${{ github.sha }}
          path: artifacts/htr_v3_canal
          if-no-files-found: error
          retention-days: 30

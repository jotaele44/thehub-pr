name: apply-federation-icon-fix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-federation-icon-fix.yml"
      - "PRII-THEHUB.app/Contents/Resources/AppIcon.icns"
      - "PRII Federation.app/Contents/Resources/AppIcon.icns"

permissions:
  contents: write

jobs:
  normalize-icon:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Replace legacy federation icon
        shell: bash
        run: |
          set -euo pipefail
          cp "PRII-THEHUB.app/Contents/Resources/AppIcon.icns" "PRII Federation.app/Contents/Resources/AppIcon.icns"
          cmp "PRII-THEHUB.app/Contents/Resources/AppIcon.icns" "PRII Federation.app/Contents/Resources/AppIcon.icns"
          if git diff --quiet -- "PRII Federation.app/Contents/Resources/AppIcon.icns"; then
            echo "Icon already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "PRII Federation.app/Contents/Resources/AppIcon.icns"
          git commit -m "fix: normalize federation bundle icon"
          git push origin "HEAD:${{ github.head_ref }}"

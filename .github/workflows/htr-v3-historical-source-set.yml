name: HTR v3 historical source-set acquisition

on:
  pull_request:
    paths:
      - "scripts/freeze_htr_v3_historical_sources.py"
      - ".github/workflows/htr-v3-historical-source-set.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check pypdf
      - name: Freeze bounded historical source set
        run: python scripts/freeze_htr_v3_historical_sources.py --out artifacts/htr_v3_historical
      - name: Display summary
        if: always()
        run: |
          if [ -f artifacts/htr_v3_historical/summary.json ]; then cat artifacts/htr_v3_historical/summary.json; fi
      - name: Upload frozen historical source set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htr-v3-history-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/htr_v3_historical
          if-no-files-found: error
          retention-days: 30

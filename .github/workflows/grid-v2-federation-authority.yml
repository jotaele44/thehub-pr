name: PR Grid V2 federation authority parity

on:
  pull_request:
    paths:
      - "src/hub/grid_v2_authority.py"
      - "scripts/validate_pr_grid_v2_federation.py"
      - "registry/spatial/v2/**"
      - "federation/spatial/pr_grid_geographic_v2.pin.json"
      - ".github/workflows/grid-v2-federation-authority.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-six-consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Fetch narrow live pin and authority manifestations
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/prii_grid_v2"
          mkdir -p "$root"
          for repo in spiderweb-pr aguayluz-pr skywatcher-pr ovnis-pr moneysweep-pr centinelas-pr; do
            git clone --depth 1 --filter=blob:none --sparse "https://github.com/jotaele44/$repo.git" "$root/$repo"
            if [ "$repo" = "spiderweb-pr" ]; then
              git -C "$root/$repo" sparse-checkout set registry/spatial/v2/pr_grid_geographic_v2.manifest.json registry/spatial/v2/pr_grid_geographic_v2.source.json schemas/pr_grid_geographic_v2_cell.schema.json schemas/pr_grid_geographic_v2_binding.schema.json schemas/pr_grid_geographic_v2_mask.schema.json schemas/pr_grid_geographic_v2_manifest.schema.json
            else
              git -C "$root/$repo" sparse-checkout set federation/spatial/pr_grid_geographic_v2.pin.json
            fi
          done
          python scripts/validate_pr_grid_v2_federation.py --workspace-root "$root" --authority-root "$root/spiderweb-pr"

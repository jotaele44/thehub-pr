name: TheHub recovery successor v1 — receipts and authority constitution
on:
  push:
    branches: [recovery/floot-baseline-2026-09-30]
    paths:
      - ".recovery/thehub-successor-v1/**"
      - ".github/workflows/recovery-thehub-successor-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  successor-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Reproduce exact semantic 128-test baseline
        shell: bash
        run: bash .recovery/thehub-exact/run.sh
      - name: Apply successor v1
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/recovered"
          cp .recovery/thehub-successor-v1/hubProducerReceipts.tsx "$ROOT/helpers/hubProducerReceipts.tsx"
          cp .recovery/thehub-successor-v1/hubProducerReceipts.spec.tsx "$ROOT/helpers/hubProducerReceipts.spec.tsx"
          cp .recovery/thehub-successor-v1/hubAuthorityConstitution.tsx "$ROOT/helpers/hubAuthorityConstitution.tsx"
          cp .recovery/thehub-successor-v1/hubAuthorityConstitution.spec.tsx "$ROOT/helpers/hubAuthorityConstitution.spec.tsx"
          cp .recovery/thehub-successor-v1/federationRecoveryParity.tsx "$ROOT/helpers/federationRecoveryParity.tsx"
          cp .recovery/thehub-successor-v1/federationRecoveryParity.spec.tsx "$ROOT/helpers/federationRecoveryParity.spec.tsx"
          cd "$ROOT"
          sha256sum helpers/hubProducerReceipts.tsx helpers/hubProducerReceipts.spec.tsx helpers/hubAuthorityConstitution.tsx helpers/hubAuthorityConstitution.spec.tsx helpers/federationRecoveryParity.tsx helpers/federationRecoveryParity.spec.tsx > successor-v1-overlay-hashes.txt
      - name: Execute successor v1 regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/recovered"
          mapfile -t exec_specs < <(awk -F '\t' '$2=="EXECUTABLE" || $2=="RECONSTRUCTED_SEMANTIC_SUPERSESSION"{print $1}' recovery-spec-classification.tsv)
          exec_specs+=(helpers/hubProducerReceipts.spec.tsx helpers/hubAuthorityConstitution.spec.tsx helpers/federationRecoveryParity.spec.tsx)
          set +e
          npx vitest run --config recovery.vitest.config.mts --reporter=verbose "${exec_specs[@]}" 2>&1 | tee successor-v1-vitest.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > successor-v1-test-exit.txt
          test "$status" = "0"
          grep -q "153 passed" successor-v1-vitest.log
      - name: Production build
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/recovered"
          set +e
          npx vite build 2>&1 | tee successor-v1-build.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > successor-v1-build-exit.txt
          test "$status" = "0"
      - name: Freeze successor v1 receipt
        shell: bash
        run: |
          cd "$RUNNER_TEMP/recovered"
          {
            echo "schema=thehub-recovery-successor/v1"
            echo "baseline_tests=128"
            echo "successor_v1_tests=153"
            echo "cross_cutting_contract_parity=AUTH_ACL_DB_SCHEMA_SOURCE_PASS"
            echo "historical_db_rows=UNAVAILABLE_NO_DUMP_PRESERVED"
            echo "rendered_all_apps=OPEN"
            echo "authoritative_acquisition=OPEN"
            echo "infrastructure_migration=BLOCKED"
            echo "producer_receipts=EXACT_FINGERPRINT_HEAD_SCHEMA_REQUIRED"
            echo "synthesized_pass=DENY"
            echo "implicit_authority_transfer=DENY"
            echo "domain_authority=RETAINED_BY_PRODUCERS"
            echo "thehub_authority=DEPENDENCY_COMPATIBILITY_PROVENANCE_CROSS_REPO_RELEASE_LOCKSTEP_CERTIFICATION"
            echo "federation_certification=AUTHORITY_RECEIPTS_LOCKSTEP_ZERO_RESIDUE"
            echo "state=PASS"
          } > successor-v1-receipt.txt
          sha256sum package-lock.json successor-v1-overlay-hashes.txt successor-v1-vitest.log successor-v1-build.log successor-v1-receipt.txt > successor-v1-evidence-hashes.txt
      - name: Upload successor v1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thehub-recovery-successor-v1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/recovered/package-lock.json
            ${{ runner.temp }}/recovered/successor-v1-overlay-hashes.txt
            ${{ runner.temp }}/recovered/successor-v1-vitest.log
            ${{ runner.temp }}/recovered/successor-v1-test-exit.txt
            ${{ runner.temp }}/recovered/successor-v1-build.log
            ${{ runner.temp }}/recovered/successor-v1-build-exit.txt
            ${{ runner.temp }}/recovered/successor-v1-receipt.txt
            ${{ runner.temp }}/recovered/successor-v1-evidence-hashes.txt

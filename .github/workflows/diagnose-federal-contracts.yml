name: Federal contracts diagnostic

on:
  push:
    branches:
      - codex/federal-records-contracts-v1

permissions:
  contents: read

jobs:
  pytest-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run pytest and retain report
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short --junitxml=pytest-junit.xml > pytest-output.txt 2>&1
          status=$?
          echo "$status" > pytest-exit-code.txt
          tail -n 200 pytest-output.txt > pytest-tail.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: federal-contracts-pytest-diagnostic
          path: |
            pytest-junit.xml
            pytest-output.txt
            pytest-tail.txt
            pytest-exit-code.txt
          if-no-files-found: error

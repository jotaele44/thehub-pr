name: Federation Spatial Contract

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: federation-spatial-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spatial-contract:
    name: spatial-contract-generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install -e .

      - name: Schema freeze
        run: python tests/test_schema_freeze.py

      - name: Spatial contract tests
        run: python -m pytest tests/test_federation_spatial_index_contract.py tests/test_spatial_federation.py -q

      # The generation record is the artifact that satisfies the lockstep rule.
      # It is regenerated here so a stale record cannot pass for a live one.
      # Only the Hub's own checkout is present in CI, so the recorded state is
      # verified rather than recomputed across sibling repositories.
      - name: Contract generation is closed
        run: |
          python - <<'PY'
          import json, sys
          record = json.load(open("registry/spatial/contract_generation.json"))
          if record["generation_state"] != "CLOSED":
              sys.exit(f"generation OPEN; blocking: {record['blocking_repositories']}")
          dispositions = {e["repository"]: e["disposition"] for e in record["affected_repositories"]}
          unresolved = [r for r, d in dispositions.items() if d not in {"ADVANCED", "ATTESTED"}]
          if unresolved:
              sys.exit(f"repositories neither advanced nor attested: {unresolved}")
          print(f"generation {record['generation']} CLOSED over {record['affected_count']} repositories")
          for repo, disposition in sorted(dispositions.items()):
              print(f"  {repo}: {disposition}")
          PY

name: GUI backend parity local contract

on:
  pull_request:
    paths:
      - ".federation/gui_backend_contract.json"
      - ".federation/gui-capabilities.json"
      - "server/backend/**"
      - "server/frontend/**"
      - "desktop/**"
      - "src/**"
      - "federation-audit/pyproject.toml"
      - "federation-audit/contracts/gui-backend-contract.schema.json"
      - "federation-audit/src/federation_audit/**"
      - ".github/workflows/gui-backend-parity-local.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install federation auditor
        run: python -m pip install -e ./federation-audit
      - name: Validate exact audited-source boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          from jsonschema import Draft202012Validator
          path = Path('.federation/gui_backend_contract.json')
          data = json.loads(path.read_text())
          schema = json.loads(Path('federation-audit/contracts/gui-backend-contract.schema.json').read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(data)
          assert data['schema_version'] == 'federation.gui-backend-contract/1.0'
          assert data['policy']['require_zero_material_residue'] is True
          source = data['source_commit']
          assert re.fullmatch(r'[0-9a-f]{40}', source)
          subprocess.run(['git','cat-file','-e',source + '^{commit}'], check=True)
          subprocess.run(['git','merge-base','--is-ancestor',source,'HEAD'], check=True)
          watched = [*data['discovery']['backend_roots'], *data['discovery']['frontend_roots'], *data['discovery']['route_files'], *data['discovery']['navigation_files'], *data['discovery'].get('existing_gui_capability_manifests', [])]
          changed = subprocess.check_output(['git','diff','--name-only',source + '..HEAD'], text=True).splitlines()
          def covered(name):
              for raw in watched:
                  raw = raw.rstrip('/')
                  if name == raw or name.startswith(raw + '/'):
                      return True
              return False
          stale = sorted(name for name in changed if covered(name))
          if stale:
              raise SystemExit('gui_backend_contract source_commit predates audited source changes: ' + ', '.join(stale))
          assert set(data['runtime_evidence']) == {'data','identity','geometry','device'}
          print('local contract boundary: PASS')
          PY
      - name: Audit exact current contract content
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          PYTHONPATH=federation-audit/src python - <<'PY'
          import copy
          import json
          import subprocess
          from pathlib import Path
          from federation_audit.parity import audit_repository

          root = Path.cwd()
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          contract_path = root / '.federation/gui_backend_contract.json'
          contract = json.loads(contract_path.read_text())
          audited_source = contract['source_commit']
          current_contract = copy.deepcopy(contract)
          current_contract['source_commit'] = head
          authority_matrix = json.loads(
              (root / 'federation-audit/manifests/gui-backend-authority-matrix.json').read_text()
          )
          report = audit_repository(
              root,
              {
                  'id': 'thehub-pr',
                  'repository': 'Jotaele44/thehub-pr',
                  'commit': head,
                  'workspace_directory': 'thehub-pr',
              },
              current_contract,
              contract_source='repository',
              authority_matrix=authority_matrix,
          )
          receipt = {
              'schema_version': 'thehub.gui-backend-contract-audit/1.0',
              'head': head,
              'audited_source_commit': audited_source,
              'state': report['state'],
              'material_residue': report['material_residue'],
              'inventory': report['inventory'],
              'findings': report['findings'],
          }
          output = root / 'artifacts/gui-backend-contract-audit.json'
          output.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          if report['state'] != 'PASS' or report['material_residue'] != 0:
              raise SystemExit(5)
          PY
      - name: Run repository GUI capability parity when available
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/check_gui_parity.py ]; then
            python scripts/check_gui_parity.py
          else
            echo 'No repository gui-capabilities checker; federation strict scanner is authoritative for executability.'
          fi
      - name: Upload contract audit receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gui-backend-contract-audit-${{ github.sha }}
          path: artifacts/gui-backend-contract-audit.json
          if-no-files-found: warn
          retention-days: 30

name: FOIA canary intake
on:
  repository_dispatch:
    types: [foia-canary]
permissions:
  contents: write
jobs:
  intake:
    if: github.event.client_payload.canary == true
    runs-on: ubuntu-latest
    steps:
      - name: Validate canary branch
        env:
          BRANCH: ${{ github.event.client_payload.canary_branch }}
        run: |
          case "$BRANCH" in canary/*) ;; *) echo "unsafe canary branch" >&2; exit 1;; esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.canary_branch }}
      - name: Persist namespaced receipt only
        id: persist
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          EXPECTED_REPO: thehub-pr
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          p=json.loads(os.environ['PAYLOAD'])
          assert p['canary'] is True and p['target_repo']==os.environ['EXPECTED_REPO']
          assert p['canary_branch'].startswith('canary/')
          assert p['no_production_promotion'] is True
          env=p['envelope']; key=p['idempotency_key']
          assert env['schema_name']=='prii.foia.finding' and env['schema_version']=='0.2.0'
          root=pathlib.Path('artifacts/foia_canary_receipts')
          out=root/f"{hashlib.sha256(key.encode()).hexdigest()}.json"
          duplicate=out.exists(); root.mkdir(parents=True,exist_ok=True)
          if not duplicate:
              record_id=f"{p['destination']}-canary-{hashlib.sha256(key.encode()).hexdigest()[:20]}"
              out.write_text(json.dumps({'record_id':record_id,'duplicate':False,'payload':p},indent=2,sort_keys=True)+'\n')
          else:
              record_id=json.loads(out.read_text())['record_id']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"duplicate={str(duplicate).lower()}\nrecord_id={record_id}\n")
          PY
      - name: Commit canary receipt
        run: |
          git config user.name foia-canary-bot
          git config user.email actions@users.noreply.github.com
          git add artifacts/foia_canary_receipts
          git diff --cached --quiet || git commit -m "test: persist FOIA canary receipt [skip ci]"
          git push origin HEAD:${{ github.event.client_payload.canary_branch }}
      - name: Callback acknowledgment
        env:
          TOKEN: ${{ secrets.FEDERATION_DISPATCH_TOKEN }}
          RECORD_ID: ${{ steps.persist.outputs.record_id }}
          DUPLICATE: ${{ steps.persist.outputs.duplicate }}
        run: |
          test -n "$TOKEN"
          curl -sSf -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/jotaele44/centinelas-pr/dispatches -d "{\"event_type\":\"foia-canary-ack\",\"client_payload\":{\"idempotency_key\":\"${{ github.event.client_payload.idempotency_key }}\",\"destination\":\"${{ github.event.client_payload.destination }}\",\"record_id\":\"$RECORD_ID\",\"duplicate\":$DUPLICATE,\"status\":\"acknowledged\"}}"

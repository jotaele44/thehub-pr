name: Federation completion gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  remote-completion-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Audit exact remote PR denominator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=()
          # PRs exercise the auditor without claiming federation completion.
          # Scheduled/manual runs are the fail-closed completion assertion.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            args+=(--allow-rate-limit-partial)
            args+=(--max-prs 25)
          else
            args+=(--fail-on-actionable)
          fi
          python scripts/federation_completion_gate.py \
            --config federation/completion-gate.json \
            --out artifacts/federation-completion-ledger.json \
            "${args[@]}"
      - name: Upload evidence ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: federation-completion-ledger
          path: artifacts/federation-completion-ledger.json
          if-no-files-found: error

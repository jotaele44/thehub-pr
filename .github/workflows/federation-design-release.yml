name: federation-design-release

on:
  workflow_dispatch:
  push:
    tags:
      - "federation-design-v*"
  pull_request:
    branches: [main]
    paths:
      - "federation-design/**"
      - "docs/FEDERATION_DESIGN_SYSTEM_*"
      - ".github/workflows/federation-design-release.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-pack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: federation-design/packages/react
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Unit and contract tests
        run: npm test
      - name: Verify tokens, accessibility, contrast, reduced motion and API snapshot
        run: npm run verify
      - name: Pack immutable release candidate
        run: npm pack
      - name: Verify release-manifest source hashes
        run: npm run verify
      - name: Verify tarball contract and write checksum
        run: |
          tgz=$(ls pr-federation-react-*.tgz)
          tar -tzf "$tgz" | sort
          for required in \
            package/dist/federation.css \
            package/dist/federation.tokens.json \
            package/dist/federation.tokens.schema.json \
            package/dist/test-harness.contract.json \
            package/dist/release-manifest.json \
            package/api-snapshot.json \
            package/src/index.jsx \
            package/src/semantics.js; do
            tar -tzf "$tgz" | grep -qx "$required"
          done
          sha256sum "$tgz" > SHA256SUMS
      - name: Upload candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: federation-design-${{ github.sha }}
          path: |
            federation-design/packages/react/pr-federation-react-*.tgz
            federation-design/packages/react/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/federation-design-v')
    needs: verify-and-pack
    permissions:
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: federation-design/packages/react
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Rebuild and verify immutable release artifact
        run: |
          npm test
          npm run verify
          npm pack
          npm run verify
          tgz=$(ls pr-federation-react-*.tgz)
          sha256sum "$tgz" > SHA256SUMS
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          test "$GITHUB_REF_NAME" = "federation-design-v$version"
      - name: Attach immutable tarball and checksum to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            federation-design/packages/react/pr-federation-react-*.tgz
            federation-design/packages/react/SHA256SUMS

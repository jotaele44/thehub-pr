name: HTR v3 frozen road recurrence contract

on:
  pull_request:
    paths:
      - "data/htr/runs/2026-09-02_htr_v3_frozen_road_recurrence_receipt.json"
      - "scripts/validate_htr_v3_road_recurrence_receipt.py"
      - ".github/workflows/htr-v3-road-recurrence-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-frozen-recurrence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Validate frozen recurrence contract
        run: python scripts/validate_htr_v3_road_recurrence_receipt.py

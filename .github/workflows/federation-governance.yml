name: Federation Governance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    name: federation-governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install governance dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Run fail-closed governance gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/federation_governance.py \
              --base "${{ github.event.pull_request.base.sha }}" \
              --head "${{ github.event.pull_request.head.sha }}"
          else
            python scripts/federation_governance.py --all
          fi

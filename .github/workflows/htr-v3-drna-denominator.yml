name: HTR v3 DRNA reservoir denominator

on:
  pull_request:
    paths:
      - "scripts/freeze_htr_v3_drna_denominator.py"
      - ".github/workflows/htr-v3-drna-denominator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-drna:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check pypdf
      - name: Freeze DRNA 2004 and 2016 tables
        run: python scripts/freeze_htr_v3_drna_denominator.py --out artifacts/htr_v3_drna
      - name: Display summary
        if: always()
        run: |
          if [ -f artifacts/htr_v3_drna/summary.json ]; then cat artifacts/htr_v3_drna/summary.json; fi
      - name: Upload frozen DRNA denominator
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htr-v3-drna-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/htr_v3_drna
          if-no-files-found: error
          retention-days: 30

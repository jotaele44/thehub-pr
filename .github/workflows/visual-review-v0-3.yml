name: visual-review-v0-3

on:
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "PRII-THEHUB.app/**"
      - "PRII Federation.app/**"
      - ".github/workflows/visual-review-v0-3.yml"

permissions:
  contents: read

jobs:
  launcher-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser
        run: |
          mkdir -p /tmp/thehub-visual && cd /tmp/thehub-visual
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Create launcher visual assertions
        run: |
          mkdir -p visual-artifacts
          cat > /tmp/thehub-visual/review.mjs <<'JS'
          import { chromium } from 'playwright'
          import fs from 'node:fs'

          const rows = [
            { repo: 'thehub-pr', name: 'TheHub', icon: 'TH', domain: 'Federation control plane', is_hub: true, present: true, has_desktop: true, has_app_bundle: true, setup_complete: true, running: true, github_url: 'https://github.com/jotaele44/thehub-pr' },
            { repo: 'moneysweep-pr', name: 'MoneySweep', icon: 'MS', domain: 'Public money', is_hub: false, present: true, has_desktop: true, has_app_bundle: true, setup_complete: true, running: false, github_url: 'https://github.com/jotaele44/moneysweep-pr' },
            { repo: 'spiderweb-pr', name: 'Spiderweb', icon: 'SW', domain: 'Spatial / airspace ops', is_hub: false, present: true, has_desktop: true, has_app_bundle: true, setup_complete: true, running: false, github_url: 'https://github.com/jotaele44/spiderweb-pr' },
            { repo: 'aguayluz-pr', name: 'AguaYLuz', icon: 'AL', domain: 'Water & grid', is_hub: false, present: true, has_desktop: true, has_app_bundle: true, setup_complete: true, running: false, github_url: 'https://github.com/jotaele44/aguayluz-pr' },
            { repo: 'ovnis-pr', name: 'OVNIS', icon: 'OV', domain: 'Case corpus', is_hub: false, present: true, has_desktop: true, has_app_bundle: true, setup_complete: true, running: false, github_url: 'https://github.com/jotaele44/ovnis-pr' },
            { repo: 'skywatcher-pr', name: 'Skywatcher', icon: 'SK', domain: 'Airspace intelligence', is_hub: false, present: false, has_desktop: false, has_app_bundle: false, setup_complete: false, running: false, github_url: 'https://github.com/jotaele44/skywatcher-pr' },
            { repo: 'centinelas-pr', name: 'Centinelas', icon: 'CE', domain: 'Pre-signal monitoring', is_hub: false, present: true, has_desktop: true, has_app_bundle: true, setup_complete: true, running: false, github_url: 'https://github.com/jotaele44/centinelas-pr' },
          ]
          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({ viewport: { width: 760, height: 960 } })
          const errors = []
          page.on('console', msg => { if (msg.type() === 'error') errors.push(msg.text()) })
          page.on('pageerror', err => errors.push(err.message))
          await page.route('**/api/local/federation', route => route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(rows) }))
          await page.goto('http://127.0.0.1:4174/launcher.html', { waitUntil: 'networkidle' })
          await page.waitForSelector('.card')
          const desktop = await page.evaluate(() => {
            const icons = [...document.querySelectorAll('.app-icon')]
            const names = [...document.querySelectorAll('.card .name')].map(e => e.textContent.trim())
            return {
              title: document.title,
              h1: document.querySelector('h1')?.textContent.trim(),
              visibleText: document.body.innerText,
              iconText: icons.map(e => e.textContent.trim()),
              iconBoxes: icons.map(e => { const r = e.getBoundingClientRect(); return { width: r.width, height: r.height, radius: getComputedStyle(e).borderRadius } }),
              names,
              bodyOverflow: document.documentElement.scrollWidth > window.innerWidth,
            }
          })
          const expectedNames = ['TheHub','MoneySweep','Spiderweb','AguaYLuz','OVNIS','Skywatcher','Centinelas']
          const expectedIcons = ['TH','MS','SW','AL','OV','SK','CE']
          if (desktop.title !== 'TheHub' || desktop.h1 !== 'TheHub') throw new Error('Launcher title/header not normalized')
          if (JSON.stringify(desktop.names) !== JSON.stringify(expectedNames)) throw new Error(`Unexpected names: ${JSON.stringify(desktop.names)}`)
          if (JSON.stringify(desktop.iconText) !== JSON.stringify(expectedIcons)) throw new Error(`Unexpected icon tiles: ${JSON.stringify(desktop.iconText)}`)
          if (desktop.iconBoxes.some(b => b.width !== 44 || b.height !== 44)) throw new Error(`Non-uniform icon box: ${JSON.stringify(desktop.iconBoxes)}`)
          if (/PRII|\b(?:thehub|moneysweep|spiderweb|aguayluz|ovnis|skywatcher|centinelas)-pr\b/i.test(desktop.visibleText)) throw new Error(`Forbidden visible branding: ${desktop.visibleText}`)
          if (desktop.bodyOverflow || errors.length) throw new Error(`Desktop overflow/errors: ${JSON.stringify({ overflow: desktop.bodyOverflow, errors })}`)
          await page.screenshot({ path: `${process.env.GITHUB_WORKSPACE}/visual-artifacts/thehub-launcher-760.png`, fullPage: true })

          await page.setViewportSize({ width: 390, height: 844 })
          await page.reload({ waitUntil: 'networkidle' })
          await page.waitForSelector('.card')
          const mobile = await page.evaluate(() => ({
            bodyOverflow: document.documentElement.scrollWidth > window.innerWidth,
            width: window.innerWidth,
            scrollWidth: document.documentElement.scrollWidth,
            cards: document.querySelectorAll('.card').length,
          }))
          if (mobile.bodyOverflow || mobile.cards !== 7) throw new Error(`Mobile launcher regression: ${JSON.stringify(mobile)}`)
          await page.screenshot({ path: `${process.env.GITHUB_WORKSPACE}/visual-artifacts/thehub-launcher-390x844.png`, fullPage: true })
          fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/visual-artifacts/thehub-review-ledger.json`, JSON.stringify({ result: 'PASS', desktop, mobile, consoleErrors: errors }, null, 2))
          await browser.close()
          JS
      - name: Run launcher review
        run: |
          python3 -m http.server 4174 --directory desktop > /tmp/thehub-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4174/launcher.html >/dev/null && break; sleep 1; done
          node /tmp/thehub-visual/review.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: thehub-launcher-visual-review
          path: visual-artifacts
          if-no-files-found: error

  macos-identity:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify TheHub bundle identities and render icons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p macos-identity-artifacts
          python3 - <<'PY'
          import json, plistlib
          from pathlib import Path
          expected = {
              'PRII-THEHUB.app': 'TheHub',
              'PRII Federation.app': 'TheHub',
          }
          ledger = {'result': 'PASS', 'bundles': []}
          for bundle, name in expected.items():
              plist_path = Path(bundle) / 'Contents' / 'Info.plist'
              with plist_path.open('rb') as f:
                  p = plistlib.load(f)
              assert p['CFBundleDisplayName'] == name
              assert p['CFBundleName'] == name
              assert p['CFBundleIconFile'] == 'AppIcon'
              icon = Path(bundle) / 'Contents' / 'Resources' / 'AppIcon.icns'
              assert icon.is_file() and icon.stat().st_size > 0
              ledger['bundles'].append({'bundle': bundle, 'displayName': p['CFBundleDisplayName'], 'bundleName': p['CFBundleName'], 'iconBytes': icon.stat().st_size})
          Path('macos-identity-artifacts/thehub-macos-ledger.json').write_text(json.dumps(ledger, indent=2))
          PY
          sips -s format png "PRII-THEHUB.app/Contents/Resources/AppIcon.icns" --out macos-identity-artifacts/thehub-app-icon.png >/dev/null
          sips -s format png "PRII Federation.app/Contents/Resources/AppIcon.icns" --out macos-identity-artifacts/federation-app-icon.png >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: thehub-macos-identity
          path: macos-identity-artifacts
          if-no-files-found: error

name: Federation runtime certification

on:
  pull_request:
    paths:
      - "federation-audit/**"
      - ".github/workflows/federation-runtime-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FEDERATION_WORKSPACE: ${{ github.workspace }}/federation-workspace
      FEDERATION_ARTIFACTS: ${{ github.workspace }}/federation-audit/artifacts
      FEDERATION_RUNTIME_DEPS: ${{ github.workspace }}/federation-audit/.runtime-deps
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Checkout TheHub exact pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: Jotaele44/thehub-pr
          ref: 94e000b5e0f21a5d1acaed42e79e73523c86ab56
          path: federation-workspace/thehub-pr
          persist-credentials: false

      - name: Checkout Spiderweb exact pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: Jotaele44/spiderweb-pr
          ref: f46546ef24c7dc2164b3f203d1af57e7d2570219
          path: federation-workspace/spiderweb-pr
          persist-credentials: false

      - name: Checkout Skywatcher exact pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: Jotaele44/skywatcher-pr
          ref: 39e1fb297e24cd9017167a8725b40e73dd0349e4
          path: federation-workspace/skywatcher-pr
          persist-credentials: false

      - name: Checkout Ovnis exact pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: Jotaele44/ovnis-pr
          ref: 68b87366207cb3fe249814ee6611a03b18d67a6b
          path: federation-workspace/ovnis-pr
          persist-credentials: false

      - name: Checkout Aguayluz exact pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: Jotaele44/aguayluz-pr
          ref: 3678271a03e36375dc3e9f2fb4da0b6b655622bd
          path: federation-workspace/aguayluz-pr
          persist-credentials: false

      - name: Checkout Centinelas exact pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: Jotaele44/centinelas-pr
          ref: caf086598a4f99e2eb0ca4aac6d51e2d9bd46321
          path: federation-workspace/centinelas-pr
          persist-credentials: false

      - name: Checkout MoneySweep exact pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: Jotaele44/moneysweep-pr
          ref: 74b10245f925bfd9b9ea07b2ce986981d5d65525
          path: federation-workspace/moneysweep-pr
          persist-credentials: false

      - name: Verify exact pins
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest = json.loads(Path('federation-audit/manifests/federation.json').read_text())
          root = Path('federation-workspace')
          for repo in manifest['repositories']:
              checkout = root / repo['workspace_directory']
              actual = subprocess.check_output(['git', '-C', str(checkout), 'rev-parse', 'HEAD'], text=True).strip()
              if actual != repo['commit']:
                  raise SystemExit(f"pin mismatch {repo['id']}: expected={repo['commit']} actual={actual}")
          print('exact pins: 7/7')
          PY

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install audit development dependencies
        run: python -m pip install -e './federation-audit[dev]'

      - name: Validate manifest and unit gates
        shell: bash
        run: |
          set -euo pipefail
          federation-audit validate-manifest federation-audit/manifests/federation.json
          pytest federation-audit/tests
          ruff check federation-audit/src federation-audit/tests
          mypy federation-audit/src

      - name: Run Playwright containment fixture
        working-directory: federation-audit/playwright
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          python -m http.server 4173 --bind 127.0.0.1 --directory fixtures >/dev/null 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          npm test

      - name: Stage runtime dependencies in matching container ABI
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$FEDERATION_RUNTIME_DEPS"
          mkdir -p "$FEDERATION_RUNTIME_DEPS" "$FEDERATION_ARTIFACTS"
          chmod 0777 "$FEDERATION_ARTIFACTS"
          docker run --rm \
            -v "$FEDERATION_RUNTIME_DEPS:/runtime-env:rw" \
            -v "$GITHUB_WORKSPACE/federation-audit:/audit-source:ro" \
            -v "$FEDERATION_ARTIFACTS:/artifacts:rw" \
            python:3.11-bookworm@sha256:c17b9ca6def1a936e55c77f086aaaf5f6a6c5f4d2fb4b7ac8c0113ba94e8b6ab \
            sh -ec '
              set -eu
              git --version
              python -m venv /runtime-env
              /runtime-env/bin/python -m pip install --disable-pip-version-check \
                --no-cache-dir -r /audit-source/runtime/requirements.lock
              /runtime-env/bin/python -m pip check
              /runtime-env/bin/python /audit-source/scripts/verify_runtime_environment.py \
                --lock /audit-source/runtime/requirements.lock \
                --snapshot /artifacts/runtime-dependencies.txt \
                --manifest /artifacts/runtime-dependencies.json
            '

      - name: Validate isolated runtime compose contract
        working-directory: federation-audit
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker/docker-compose.runtime.yml config > artifacts/compose.resolved.yml
          grep -q 'internal: true' artifacts/compose.resolved.yml
          grep -q 'read_only: true' artifacts/compose.resolved.yml
          grep -q 'no-new-privileges:true' artifacts/compose.resolved.yml

      - name: Execute closed-network exact-pin runtime certification
        working-directory: federation-audit
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker/docker-compose.runtime.yml up \
            --build --abort-on-container-exit --exit-code-from certifier certifier

      - name: Verify runtime receipt invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          root = Path('federation-audit')
          receipt = json.loads((root / 'artifacts/runtime-certification.json').read_text())
          schema = json.loads((root / 'contracts/runtime-certification.schema.json').read_text())
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(receipt)
          summary = receipt['summary']
          calibration = summary['calibration']
          assert receipt['certified'] is True, receipt['failures']
          assert summary['repositories_exact'] == 7
          assert summary['probes_passed'] == 7
          assert summary['production_egress_events'] == 0
          assert summary['production_credential_events'] == 0
          assert summary['uncontained_side_effects'] == 0
          assert calibration['precision'] == 1.0
          assert calibration['recall'] == 1.0
          assert summary['runtime_dependencies']['verified'] is True
          assert len(receipt['runtime_receipts']) == 7
          assert all(r['runtime_isolated'] and r['t2_receipt'] for r in receipt['runtime_receipts'])
          PY

      - name: Tear down isolated runtime
        if: always()
        working-directory: federation-audit
        run: docker compose -f docker/docker-compose.runtime.yml down --volumes --remove-orphans

      - name: Upload certification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: federation-runtime-certification-${{ github.sha }}
          path: |
            federation-audit/artifacts/runtime-certification.json
            federation-audit/artifacts/http.jsonl
            federation-audit/artifacts/message.jsonl
            federation-audit/artifacts/smtp.jsonl
            federation-audit/artifacts/compose.resolved.yml
            federation-audit/artifacts/runtime-dependencies.json
            federation-audit/artifacts/runtime-dependencies.txt
          if-no-files-found: warn
          retention-days: 14

name: HTR v3 frozen replay hardening

on:
  pull_request:
    paths:
      - "data/htr/runs/2026-09-13_htr_v3_frozen_replay_hardening_receipt.json"
      - "scripts/validate_htr_v3_replay_hardening.py"
      - "tests/test_htr_v3_replay_hardening.py"
      - ".github/workflows/htr-v3-replay-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-bounded-replay-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate frozen replay receipt
        run: python scripts/validate_htr_v3_replay_hardening.py
      - name: Run positive and negative regression gates
        run: python -m pytest -q tests/test_htr_v3_replay_hardening.py

name: HTR v3 authoritative source acquisition

# Acquisition is manual by design. Successful mutable-source snapshots are
# retained by artifact digest and reused; later PR commits must not silently
# redownload NID/AAA merely because the acquisition files remain in the PR diff.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install geospatial readers
        run: python -m pip install --disable-pip-version-check pyogrio geopandas

      - name: Freeze v3 authoritative source denominator
        run: python scripts/freeze_htr_v3_denominator.py --out artifacts/htr_v3_denominator

      - name: Display summary
        if: always()
        run: |
          if [ -f artifacts/htr_v3_denominator/summary.json ]; then
            cat artifacts/htr_v3_denominator/summary.json
          fi

      - name: Upload frozen v3 denominator
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htr-v3-denominator-${{ github.sha }}
          path: artifacts/htr_v3_denominator
          if-no-files-found: error
          retention-days: 30

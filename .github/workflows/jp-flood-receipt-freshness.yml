name: JP flood receipt freshness

on:
  workflow_dispatch:
  schedule:
    - cron: "47 12 * * 0"
  pull_request:
    paths:
      - "governance/producer_receipt_refs.json"
      - "scripts/check_jp_flood_receipt_freshness.py"
      - "tests/test_jp_flood_receipt_freshness.py"
      - ".github/workflows/jp-flood-receipt-freshness.yml"
  push:
    branches: [main]
    paths:
      - "governance/producer_receipt_refs.json"
      - "scripts/check_jp_flood_receipt_freshness.py"
      - ".github/workflows/jp-flood-receipt-freshness.yml"

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run freshness classification regressions
        run: python -m pytest -q tests/test_jp_flood_receipt_freshness.py
      - name: Check latest durable receipt against pinned authority
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          python scripts/check_jp_flood_receipt_freshness.py | tee artifacts/jp-flood-receipt-freshness.json
      - name: Upload freshness receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jp-flood-receipt-freshness
          path: artifacts/jp-flood-receipt-freshness.json
          if-no-files-found: warn
          retention-days: 90

name: Federation pickup bounded MAX

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-max:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout exact certified OVNIS development head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jotaele44/ovnis-pr
          ref: f5cf496095f00869d27312d15ea9bfe9d3eb5941
          path: .fed/checkouts/ovnis-pr
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install control plane and bounded OVNIS verification dependencies
        run: |
          python -m pip install -e .
          python -m pip install -r .fed/checkouts/ovnis-pr/requirements.txt

      - name: Execute frozen remote MAX apply pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fed --root .fed/checkouts max --remote --apply | tee federation-max.json

      - name: Assert first real domain READY execution and bounded exhaustion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path("federation-max.json").read_text(encoding="utf-8"))
          execution = receipt["execution"]
          certification = receipt["certification"]
          repo_status = receipt["repository_status"]

          assert execution["apply"] is True
          assert execution["bounded_exhausted"] is True
          assert execution["ready_residue"] == []
          assert execution["final_status"]["FEDERATION_PICKUP_SYSTEM_LEVEL_3"] == "PASS"
          assert execution["final_status"]["CREATE_PRUFON_CASE_SCHEMA_IMPORT_PIPELINE"] == "PASS"
          assert execution["final_status"]["BUILD_SKYWATCHER_NON_SYNTHETIC_EXPORT"] == "BLOCKED"
          assert execution["final_status"]["PR_GOVERNMENT_FINANCE_100_PERCENT_COVERAGE"] == "BLOCKED"
          assert execution["final_status"]["DISCOVER_CENTINELAS_ACTIVE_VECTOR"] == "OPEN"
          assert certification["universal_exhaustion_claimed"] is False
          assert certification["certification"] == "PROVISIONAL"
          assert certification["repository_status_phase"] == "post_execution"

          # The existing control-plane PASS is reused. Exactly one real domain
          # vector must execute, and it must be the certified OVNIS development lineage.
          assert "FEDERATION_PICKUP_SYSTEM_LEVEL_3" not in execution["completed"]
          assert execution["completed"] == ["CREATE_PRUFON_CASE_SCHEMA_IMPORT_PIPELINE"]
          executed_rows = [
              row
              for pass_row in execution["passes"]
              for row in pass_row["results"]
              if row.get("executed")
          ]
          assert len(executed_rows) == 1
          assert executed_rows[0]["vector_id"] == "CREATE_PRUFON_CASE_SCHEMA_IMPORT_PIPELINE"
          assert executed_rows[0]["status"] == "PASS"
          assert len(executed_rows[0]["commands"]) == 1
          assert executed_rows[0]["commands"][0]["exit_code"] == 0

          counts = {}
          for status in execution["final_status"].values():
              counts[status] = counts.get(status, 0) + 1
          assert counts == {
              "PASS": 2,
              "OPEN": 4,
              "BLOCKED": 2,
          }
          assert sum(counts.values()) == 8

          assert repo_status["phase"] == "post_execution"
          assert repo_status["arithmetic_ok"] is True
          assert repo_status["counts"] == {
              "BLOCKED": 2,
              "FAIL": 0,
              "OPEN": 4,
              "PASS": 1,
              "READY": 0,
              "UNRESOLVED": 0,
          }
          assert repo_status["classified_count"] == repo_status["repository_count"] == 7
          by_repo = {row["repo"]: row["status"] for row in repo_status["repositories"]}
          assert by_repo["jotaele44/thehub-pr"] == "OPEN"
          assert by_repo["jotaele44/centinelas-pr"] == "OPEN"
          assert by_repo["jotaele44/ovnis-pr"] == "PASS"
          assert by_repo["jotaele44/skywatcher-pr"] == "BLOCKED"
          assert by_repo["jotaele44/moneysweep-pr"] == "BLOCKED"
          print("PASS: first real domain READY wave executed exact certified OVNIS development checkout; bounded exhaustion and arithmetic close")
          PY

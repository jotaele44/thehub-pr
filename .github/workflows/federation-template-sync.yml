name: Federation template sync (propagate)

# Completes the "edit the template once" loop for the shared federation
# boilerplate (federation-templates/): re-render each producer's copies (the
# launchers, shared schema, engineering baseline and governance files) and, when
# they drift from the canonical templates, open a PR on that producer to update
# them. This is also how action-pin bumps reach the producers: their Dependabot
# skips the rendered workflows, and the hub's Dependabot bumps the templates
# (federation-templates/README.md, "Action pins").
#
# Cross-repo writes need an operator-provided SYNC_PAT secret: a fine-grained
# token whose repository access includes every producer below, with Contents,
# Pull requests and Workflows set to Read and write (a sync always edits
# .github/workflows/template-drift.yml). WITHOUT it this workflow is a DRY RUN:
# it renders, prints the drift, and opens nothing — mirroring
# mcp-cross-repo-sync.yml. With it, tools/federation_template_sync_pr.sh first
# dry-runs a push to each producer (a refusal fails that job, naming the
# permissions above), then skips producers whose only change would be the
# PRII_TEMPLATE_REF pin, and keeps one standing federation-template-sync branch
# and PR per producer, force-pushed and updated on each run. Each producer's own
# template-drift.yml is the read-only guard; this is the write-side automation.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "federation-templates/**"
      - "tools/render_federation_templates.py"
      - ".github/workflows/federation-template-sync.yml"

permissions:
  contents: read

# Serialise runs on the same ref without cancelling. This workflow can
# publish, write data, or hand off to another repo, and killing it
# mid-flight risks leaving that work half-done.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  propagate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [aguayluz-pr, centinelas-pr, moneysweep-pr, ovnis-pr, skywatcher-pr, spiderweb-pr]
    steps:
      - name: Checkout thehub-pr (canonical templates + renderer)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: thehub-pr

      - name: Checkout producer (${{ matrix.repo }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jotaele44/${{ matrix.repo }}
          path: ${{ matrix.repo }}
          token: ${{ secrets.SYNC_PAT || github.token }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pyyaml

      - name: Re-render shared boilerplate into the producer
        run: >
          python thehub-pr/tools/render_federation_templates.py
          --repo ${{ matrix.repo }} --repo-root ${{ matrix.repo }}
          --template-ref ${{ github.sha }}

      - name: Open or update the producer's sync PR if it drifted
        working-directory: ${{ matrix.repo }}
        env:
          REPO: ${{ matrix.repo }}
          HUB_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: bash "$GITHUB_WORKSPACE/thehub-pr/tools/federation_template_sync_pr.sh"

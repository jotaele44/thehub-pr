name: Hub CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repo (and uploads artifacts,
# which uses the runtime token, not GITHUB_TOKEN). Widen deliberately if a
# step ever needs to write back.
permissions:
  contents: read

# Supersede older runs of this workflow on the same ref: a newer push
# makes the in-flight result irrelevant, so cancel it and free the runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          pip install -e ".[dev]" httpx -r server/backend/requirements.txt
          if [ "${{ matrix.python-version }}" != "3.9" ]; then
            pip install -e packages/prii_desktop
          fi
      - name: Schemas are well-formed JSON
        run: python -c "import json, glob; [json.load(open(f)) for f in glob.glob('schemas/*.json')]; print('schemas ok')"
      - name: Registry loads
        run: python -m hub list --registry registry/producers.yaml
      - name: Tests
        run: pytest -q --cov --cov-report=term-missing:skip-covered

  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Lock file is up to date
        run: uv lock --check

  # Hub app frontend (server/frontend): lint, unit/axe tests, production build.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build

  # Visual-regression baselines for the hub frontend. Installs the same Chromium
  # build the committed baselines were generated with (pinned via @playwright/test).
  frontend-visual:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Visual regression
        run: npm run test:visual
      - name: Upload diff report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: server/frontend/playwright-report/
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src/hub tests
      - name: Mypy
        run: mypy src/hub

  # Does FEDERATION_READ_TOKEN exist? Its own job because the `secrets` context
  # is not dependable inside a job-level `if:`; reading it into a job-level env
  # and re-emitting it as an output is the portable way to branch on it.
  audit-claims-preflight:
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.probe.outputs.has_token }}
    env:
      FEDERATION_TOKEN: ${{ secrets.FEDERATION_READ_TOKEN }}
    steps:
      - id: probe
        run: |
          if [ -n "$FEDERATION_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

  # Re-derives the countable claims in the audit documents from the code and
  # fails when the two disagree. This job carries the checks that need only this
  # repository — it always runs, is always strict, and must always pass. Stdlib
  # only, so it needs no install step.
  audit-claims:
    runs-on: ubuntu-latest
    needs: audit-claims-preflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify audit claims against the code
        run: python3 scripts/verify_audit.py
      # A skipped check that nobody mentions reads as a passing one. If the
      # cross-repo job cannot run, say so in the log rather than let the summary
      # line imply full coverage.
      - name: Note the unenforced cross-repo checks
        if: needs.audit-claims-preflight.outputs.has_token != 'true'
        run: |
          echo "::notice title=Cross-repo audit checks not enforced::\
          FEDERATION_READ_TOKEN is not set, so audit-claims-federation did not run. \
          The checks reported SKIP above are unverified on this commit. Add a secret \
          with read access to the other six federation repositories to enable them."

  # The cross-repo half. Runs only when the token exists, and is strict when it
  # does: --require-all turns a missing sibling into a failure rather than a
  # skip. Nothing here can make the build red for want of a secret.
  audit-claims-federation:
    runs-on: ubuntu-latest
    needs: audit-claims-preflight
    if: needs.audit-claims-preflight.outputs.has_token == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # actions/checkout refuses to write outside $GITHUB_WORKSPACE, so the
      # siblings land in _federation/ while this repo stays at the root.
      # verify_audit.py resolves its own name to the script's tree (SELF_REPO_NAME),
      # so --root _federation still covers all seven.
      - uses: actions/checkout@v7
        with: { repository: jotaele44/skywatcher-pr, path: _federation/skywatcher-pr, token: "${{ secrets.FEDERATION_READ_TOKEN }}" }
      - uses: actions/checkout@v7
        with: { repository: jotaele44/moneysweep-pr, path: _federation/moneysweep-pr, token: "${{ secrets.FEDERATION_READ_TOKEN }}" }
      - uses: actions/checkout@v7
        with: { repository: jotaele44/spiderweb-pr, path: _federation/spiderweb-pr, token: "${{ secrets.FEDERATION_READ_TOKEN }}" }
      - uses: actions/checkout@v7
        with: { repository: jotaele44/centinelas-pr, path: _federation/centinelas-pr, token: "${{ secrets.FEDERATION_READ_TOKEN }}" }
      - uses: actions/checkout@v7
        with: { repository: jotaele44/aguayluz-pr, path: _federation/aguayluz-pr, token: "${{ secrets.FEDERATION_READ_TOKEN }}" }
      - uses: actions/checkout@v7
        with: { repository: jotaele44/ovnis-pr, path: _federation/ovnis-pr, token: "${{ secrets.FEDERATION_READ_TOKEN }}" }
      - name: Verify audit claims across the federation
        run: python3 scripts/verify_audit.py --root _federation --require-all

  # Self-contained sub-project (packages/prii_maintenance) — its own CI, isolated
  # from the root test matrix since its consumers (spiderweb-pr >=3.11,
  # skywatcher-pr 3.10+) don't need the root matrix's Python 3.9 floor.
  maintenance-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" -e packages/prii_maintenance
      - name: Ruff
        run: ruff check packages/prii_maintenance
      - name: Mypy
        run: mypy packages/prii_maintenance/src
      - name: Tests
        run: pytest packages/prii_maintenance/tests -q

  # Self-contained sub-project (packages/prii_export_utils) — its own CI, same
  # isolation rationale as maintenance-package above.
  export-utils-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" -e packages/prii_export_utils
      - name: Ruff
        run: ruff check packages/prii_export_utils
      - name: Mypy
        run: mypy packages/prii_export_utils/src
      - name: Tests
        run: pytest packages/prii_export_utils/tests -q

name: Hub CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repo (and uploads artifacts,
# which uses the runtime token, not GITHUB_TOKEN). Widen deliberately if a
# step ever needs to write back.
permissions:
  contents: read

# Supersede older runs of this workflow on the same ref: a newer push
# makes the in-flight result irrelevant, so cancel it and free the runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          pip install -e ".[dev]" httpx -r server/backend/requirements.txt
          if [ "${{ matrix.python-version }}" != "3.9" ]; then
            pip install -e packages/prii_desktop
          fi
      - name: Schemas are well-formed JSON
        run: python -c "import json, glob; [json.load(open(f)) for f in glob.glob('schemas/*.json')]; print('schemas ok')"
      - name: Registry loads
        run: python -m hub list --registry registry/producers.yaml
      - name: Tests
        run: pytest -q --cov --cov-report=term-missing:skip-covered

  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Lock file is up to date
        run: uv lock --check

  # Hub app frontend (server/frontend): lint, unit/axe tests, production build.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build

  # Visual-regression baselines for the hub frontend. Installs the same Chromium
  # build the committed baselines were generated with (pinned via @playwright/test).
  frontend-visual:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Visual regression
        run: npm run test:visual
      - name: Upload diff report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: server/frontend/playwright-report/
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src/hub server tests
      - name: Mypy
        run: mypy src/hub server/backend

  # Local audit claims are always strict. The federation half below is also
  # unconditional: all sibling repositories are public, so a private read token
  # is not a prerequisite for enforcing the six-repository spatial contract.
  audit-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify audit claims against the code
        run: python3 scripts/verify_audit.py

  # Live cross-repository enforcement. Missing siblings, stale pins, divergent
  # hashes, wrong defaults, or incompatible runtime contracts are hard failures.
  # The six sibling repositories are public and are checked out read-only.
  audit-claims-federation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { repository: jotaele44/skywatcher-pr, path: _federation/skywatcher-pr }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { repository: jotaele44/moneysweep-pr, path: _federation/moneysweep-pr }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { repository: jotaele44/spiderweb-pr, path: _federation/spiderweb-pr }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { repository: jotaele44/centinelas-pr, path: _federation/centinelas-pr }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { repository: jotaele44/aguayluz-pr, path: _federation/aguayluz-pr }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { repository: jotaele44/ovnis-pr, path: _federation/ovnis-pr }
      - name: Verify audit claims across the federation
        run: python3 scripts/verify_audit.py --root _federation --require-all
      - name: Check out exact PR grid V2 authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jotaele44/spiderweb-pr
          ref: b8f5cf303ab7fc2b6ed006edce0fb12e1344a096
          path: _grid_authority/spiderweb-pr
          persist-credentials: false
      - name: Verify PR grid V2 consumer pin parity
        run: >-
          python3 scripts/validate_pr_grid_v2_federation.py
          --workspace-root _federation
          --authority-root _grid_authority/spiderweb-pr

  # Self-contained sub-project (packages/prii_maintenance) — its own CI, isolated
  # from the root test matrix since its consumers (spiderweb-pr >=3.11,
  # skywatcher-pr 3.10+) don't need the root matrix's Python 3.9 floor.
  maintenance-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" -e packages/prii_maintenance
      - name: Ruff
        run: ruff check packages/prii_maintenance
      - name: Mypy
        run: mypy packages/prii_maintenance/src
      - name: Tests
        run: pytest packages/prii_maintenance/tests -q

  # Self-contained sub-project (packages/prii_export_utils) — its own CI, same
  # isolation rationale as maintenance-package above.
  export-utils-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" -e packages/prii_export_utils
      - name: Ruff
        run: ruff check packages/prii_export_utils
      - name: Mypy
        run: mypy packages/prii_export_utils/src
      - name: Tests
        run: pytest packages/prii_export_utils/tests -q

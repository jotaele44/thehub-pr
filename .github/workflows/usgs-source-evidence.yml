name: USGS frozen evidence validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/hub/usgs_*.py"
      - "scripts/*usgs*.py"
      - "tests/test_usgs*.py"
      - "data/usgs/**"
      - "registry/usgs/**"
      - ".github/workflows/usgs-source-evidence.yml"

permissions:
  contents: read

jobs:
  frozen-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: pip install -e ".[dev]" httpx -r server/backend/requirements.txt
      - name: Validate frozen evidence and refusal to activate
        run: |
          python scripts/verify_usgs_build.py
          pytest -q tests/test_usgs_catalog.py tests/test_usgs_assets.py tests/test_usgs_continuation.py
      # Acquisition ran at 38859073401. Ordinary PR synchronization must reuse
      # its frozen evidence, not repeat a 256 MiB crawl to obtain another PASS.
      # This job certifies offline checks only, never scientific readiness.

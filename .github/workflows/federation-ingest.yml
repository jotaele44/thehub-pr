name: Federation ingest

# Event-driven federation hop 2 (receiver): fires when a producer (moneysweep-pr)
# emits a `moneysweep-export` repository_dispatch after processing new upstream data.
# Runs the existing Hub CLI pipeline — fetch (clone producers) -> aggregate the
# committed canonical packages -> correlate -> ingest into data/hub.db — and uploads
# the aggregate + hub.db as artifacts. No Hub code change: producers are read from
# registry/producers.yaml exactly as the operator-run pipeline does.
#
# Note: aggregation reads each producer's *committed* canonical export package
# (federation is artifact-based). Fetch clones producers over HTTPS; a
# FEDERATION_DISPATCH_TOKEN with read access is used when producers are private.

on:
  repository_dispatch:
    # Any producer that lands a fresh canonical export triggers a Hub re-aggregate,
    # so hazard alerts (seismic, weather, contamination) reach users in minutes
    # instead of waiting for the Hub's own schedule. Add new producers' export
    # events here as they wire up their dispatch step.
    types: [moneysweep-export, aguayluz-export, centinelas-export]
  workflow_dispatch: {}

# Wider than this repo's usual `contents: read` because this workflow is the one
# that closes the ingest loop: it pushes a branch carrying the refreshed fixture
# and opens a pull request for it. `pull-requests: write` is the first in this
# repo — the refreshed data is proposed for review, never committed to main.
# `statuses: write` records the docs-sync verdict on that PR's head (see below).
permissions:
  contents: write
  pull-requests: write
  statuses: write

# Serialise runs on the same ref without cancelling. This workflow can
# publish, write data, or hand off to another repo, and killing it
# mid-flight risks leaving that work half-done.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      # prii_export_utils is what every producer's federation_export.py imports;
      # apart from it they are pure stdlib, so this one line is the whole
      # dependency story for running all six exports below.
      - name: Install
        run: pip install -e ".[dev]" -e packages/prii_export_utils

      - name: Configure git auth for producer clones
        env:
          FEDERATION_DISPATCH_TOKEN: ${{ secrets.FEDERATION_DISPATCH_TOKEN }}
        run: |
          if [ -n "$FEDERATION_DISPATCH_TOKEN" ]; then
            git config --global \
              url."https://x-access-token:${FEDERATION_DISPATCH_TOKEN}@github.com/".insteadOf \
              "https://github.com/"
            echo "Configured token auth for producer clones."
          else
            echo "No FEDERATION_DISPATCH_TOKEN — assuming public producer repos."
          fi

      # Keep a copy of the committed fixture to compare against, before the
      # build below overwrites it in place.
      - name: Snapshot the committed fixture
        run: cp -r data/aggregate "$RUNNER_TEMP/baseline"

      # `--run` is required, not an optimisation. Only moneysweep-pr commits its
      # canonical export package; the other five materialise theirs by running
      # their own export_canonical command. Without --run the aggregate sees one
      # producer and collapses to 200 entities / 9 collections, against 35,888
      # and 20 with it — so a fixture built without --run would replace real
      # federation data with a moneysweep-only stub.
      - name: Fetch producers and run their exports
        run: hub fetch --root ws --run

      # The bounded sample, not the raw aggregate: a full run is ~77 MB of JSONL
      # and a 281 MB hub.db, neither of which is committable. This runs the same
      # aggregate -> correlate -> ingest internally, capped per stream.
      - name: Build the bounded fixture
        run: python3 scripts/build_hub_fixture.py --root ws --out data

      # Fan newly-ingested alerts out to subscribers (push/SMS). Offline-safe: no-ops
      # cleanly when provider secrets are unset, still advancing the dispatch cursor.
      - name: Dispatch notifications for new alerts
        env:
          HUB_VAPID_PRIVATE_KEY: ${{ secrets.HUB_VAPID_PRIVATE_KEY }}
          HUB_SMS_API_KEY: ${{ secrets.HUB_SMS_API_KEY }}
          HUB_SMTP_URL: ${{ secrets.HUB_SMTP_URL }}
        run: python scripts/dispatch_notifications.py --db data/hub.db

      # Producers stamp created_at/extracted_at into every record on every run,
      # so `git status` reports drift even when nothing upstream moved. Gate the
      # PR on content with those fields removed, or this opens a ~2,000-line
      # timestamp-churn PR on every dispatch forever.
      - name: Has the data actually changed?
        id: drift
        run: |
          python3 scripts/fixture_drift.py "$RUNNER_TEMP/baseline" data/aggregate \
            >> "$GITHUB_OUTPUT"

      - name: Open fixture-refresh review PR with governed publisher
        if: steps.drift.outputs.drift == 'true'
        env:
          # Do not fallback to GITHUB_TOKEN, whose bot identity cannot create PRs.
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
          HAS_SYNC_PAT: ${{ secrets.SYNC_PAT != ''}'}
          STATUS_TOKEN: ${{ github.token }}
        run: |
          # Fail closed before any local or remote branch mutation.
          if [ "$HAS_SYNC_PAT" != "true" ]; then
            echo "::error title=Fixture publisher unavailable::SYNC_PAT is absent; no branch was changed."
            exit 1
          fi
          publisher="$(gh api user --jq '.login')" || {
            echo "::error title=Invalid publisher::SYNC_PAT cannot authenticate; no branch was changed."
            exit 1
          }
          if [ -z "$publisher" ] || [ "$publisher" = "github-actions[bot]" ]; then
            echo "::error title=Invalid publisher principal::A non-bot authenticated publisher is required."
            exit 1
          fi
          can_push="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.permissions.push // false')" || {
            echo "::error title=Publisher permission check failed::No branch was changed."
            exit 1
          }
          if [ "$can_push" != "true" ]; then
            echo "::error title=Publisher lacks push permission::No branch was changed."
            exit 1
          fi

          # One immutable branch per workflow run/attempt. Never force-push an
          # existing review head, particularly PR #401. A PR-publication failure
          # may leave this isolated branch for explicit operator recovery.
          branch="fixture-refresh/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "prii-federation-bot"
          git config user.email "noreply@github.com"
          git checkout -b "$branch"
          git add data/aggregate data/fixture.json
          git commit -m "data: refresh the committed federation fixture

          Regenerated by federation-ingest.yml from the producers' exports.
          Only content drift (not timestamp churn) creates this candidate."
          git push origin "HEAD:refs/heads/$branch"

          body="$(printf '%s\n' \
            "Review-only fixture refresh from ${GITHUB_WORKFLOW} run ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT}." \
            "" \
            "Producer exports were re-run and the bounded fixture was rebuilt." \
            "This candidate uses a unique branch; existing PR heads are unchanged." \
            "Review data/fixture.json, source identifiers, denominator deltas and collisions." \
            "No certification or merge is implied.")"
          # Opening the PR precedes status posting. Any PR authorization failure
          # leaves only a new isolated branch and never overwrites in-review data.
          gh pr create --draft --base main --head "$branch" \
            --title "Review bounded federation fixture refresh (${GITHUB_RUN_ID})" --body "$body"

          sha="$(git rev-parse HEAD)"
          if python3 tools/check_docs_sync.py --base "$GITHUB_SHA" --head "$sha"; then
            state=success
          else
            state=failure
          fi
          GH_TOKEN="$STATUS_TOKEN" gh api --silent -X POST \
            "repos/$GITHUB_REPOSITORY/statuses/$sha" \
            -f state="$state" -f context=docs-sync \
            -f description="docs-sync checked by federation-ingest.yml" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Note that the fixture was already current
        if: steps.drift.outputs.drift == 'false'
        run: |
          echo "::notice title=No fixture refresh needed::The pipeline ran and the \
          producer data is unchanged; only per-run timestamps moved, so no PR was \
          opened."

      - name: Upload aggregate + hub.db
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hub-aggregate
          path: |
            data/aggregate
            data/hub.db
          if-no-files-found: ignore

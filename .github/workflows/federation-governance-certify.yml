name: federation-governance-certify
on:
  pull_request:
  push:
    branches: [main, federation-governance-v1]
jobs:
  certify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest pyyaml
      - run: python scripts/federation_governance_certify.py
      - run: python -m pytest -q tests/test_federation_contract_guard.py
      - run: python scripts/federation_contract_guard.py closure governance/federation_dependencies.yaml centinelas-pr
      - run: python scripts/federation_reconcile_remote_receipts.py

name: desktop-build

# Builds the standalone double-click desktop app (PyInstaller) for each OS.
# Runs on demand, and attaches the bundles to the release on desktop-v* tags.

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "assets/branding/**"
      - "packages/prii_desktop/**"
      - "server/frontend/**"
      - "server/backend/**"
      - "tools/build_program_icons.py"
      - "tools/verify_desktop_branding.py"
      - "requirements-desktop.txt"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: write

# Serialise runs on the same ref without cancelling. This workflow can
# publish, write data, or hand off to another repo, and killing it
# mid-flight risks leaving that work half-done.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Build frontend (same-origin)
        env:
          VITE_API_BASE: ""
        run: |
          npm ci --no-audit --no-fund
          npm run build
        working-directory: server/frontend

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/backend/requirements.txt -r requirements-desktop.txt -r tools/requirements-icons.txt pyinstaller

      - name: Test shared native setup runtime
        run: |
          pip install pytest
          python -m pytest packages/prii_desktop/tests -q

      - name: Verify canonical icon derivatives
        if: runner.os == 'Linux'
        run: python tools/build_program_icons.py --repo . --check

      - name: Verify visual branding and accessibility contract
        run: |
          python tools/verify_desktop_branding.py --repo .

      - name: Freeze console build (for smoke test)
        env:
          PRII_CONSOLE: "1"
        run: pyinstaller desktop/pyinstaller.spec --distpath dist-smoke --noconfirm

      - name: Smoke test frozen app
        shell: python
        run: |
          import pathlib, subprocess, sys
          name = "PRII-THEHUB"
          exe = pathlib.Path("dist-smoke") / name / (name + (".exe" if sys.platform == "win32" else ""))
          for mode in ("--setup-smoke", "--smoke"):
              result = subprocess.run([str(exe), mode], timeout=120)
              if result.returncode:
                  sys.exit(result.returncode)

      - name: Freeze desktop app (windowed release)
        run: pyinstaller desktop/pyinstaller.spec --distpath dist-desktop --noconfirm

      - name: Sign and verify macOS app integrity
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - "dist-desktop/PRII-THEHUB.app"
          codesign --verify --deep --strict "dist-desktop/PRII-THEHUB.app"

      - name: Package bundle
        shell: bash
        run: |
          cd dist-desktop
          if [ "$RUNNER_OS" = "macOS" ] && [ -d "PRII-THEHUB.app" ]; then
            zip -qry "PRII-THEHUB-${RUNNER_OS}.zip" "PRII-THEHUB.app"
          else
            7z a -bd "PRII-THEHUB-${RUNNER_OS}.zip" "PRII-THEHUB" > /dev/null
          fi

      - name: Package .dmg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist-desktop
          staging="dmg-staging"
          rm -rf "$staging" && mkdir "$staging"
          cp -R "PRII-THEHUB.app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "PRII-THEHUB" -srcfolder "$staging" \
            -ov -format UDZO "PRII-THEHUB-macOS.dmg"
          rm -rf "$staging"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PRII-THEHUB-${{ runner.os }}
          path: |
            dist-desktop/PRII-THEHUB-*.zip
            dist-desktop/PRII-THEHUB-*.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist-desktop/PRII-THEHUB-*.zip
            dist-desktop/PRII-THEHUB-*.dmg

name: desktop-build

# Builds the standalone double-click desktop app (PyInstaller) for each OS.
# Runs on demand, and attaches the bundles to the release on desktop-v* tags.

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "assets/branding/**"
      - "packages/prii_desktop/**"
      - "server/frontend/**"
      - "server/backend/**"
      - "federation-design/**"
      - "tools/build_program_icons.py"
      - "tools/render_desktop_setup.py"
      - "tools/validate_desktop_branding.py"
      - "requirements-desktop.txt"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: write

# Serialise runs on the same ref without cancelling. This workflow can
# publish, write data, or hand off to another repo, and killing it
# mid-flight risks leaving that work half-done.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Build frontend (same-origin)
        env:
          VITE_API_BASE: ""
        run: |
          npm ci --no-audit --no-fund
          npm run build
        working-directory: server/frontend

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/backend/requirements.txt -r requirements-desktop.txt -r tools/requirements-icons.txt pyinstaller pytest httpx

      - name: Verify supplied artwork, AA palette, and fresh-machine setup
        run: |
          python tools/build_program_icons.py --repo . --check
          python tools/validate_desktop_branding.py --repo .
          python -m pytest packages/prii_desktop/tests -q

      - name: Visual and accessibility smoke for native setup
        if: runner.os == 'Linux'
        env:
          PRII_REPO_SLUG: thehub-pr
          PRII_SETUP_FIXTURE: ${{ github.workspace }}/desktop-ui-artifacts/setup.html
          PRII_VISUAL_DIR: ${{ github.workspace }}/desktop-ui-artifacts
        run: |
          python tools/render_desktop_setup.py \
            --repo . --output desktop-ui-artifacts/setup.html
          cd federation-design/test-harness
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test tests/desktop-setup.spec.js \
            --project=tablet-768 --project=desktop-1280

      - name: Upload native setup visual evidence
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thehub-pr-native-setup-visuals
          path: desktop-ui-artifacts/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Freeze console build (for smoke test)
        env:
          PRII_CONSOLE: "1"
        run: pyinstaller desktop/pyinstaller.spec --distpath dist-smoke --noconfirm

      - name: Smoke test frozen app
        shell: python
        run: |
          import pathlib, subprocess, sys
          name = "PRII-THEHUB"
          exe = pathlib.Path("dist-smoke") / name / (name + (".exe" if sys.platform == "win32" else ""))
          result = subprocess.run([str(exe), "--smoke"], timeout=120)
          sys.exit(result.returncode)

      - name: Freeze desktop app (windowed release)
        run: pyinstaller desktop/pyinstaller.spec --distpath dist-desktop --noconfirm

      - name: Package bundle
        shell: bash
        run: |
          cd dist-desktop
          if [ "$RUNNER_OS" = "macOS" ] && [ -d "PRII-THEHUB.app" ]; then
            zip -qry "PRII-THEHUB-${RUNNER_OS}.zip" "PRII-THEHUB.app"
          else
            7z a -bd "PRII-THEHUB-${RUNNER_OS}.zip" "PRII-THEHUB" > /dev/null
          fi

      - name: Package .dmg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist-desktop
          staging="dmg-staging"
          rm -rf "$staging" && mkdir "$staging"
          cp -R "PRII-THEHUB.app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "PRII-THEHUB" -srcfolder "$staging" \
            -ov -format UDZO "PRII-THEHUB-macOS.dmg"
          rm -rf "$staging"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PRII-THEHUB-${{ runner.os }}
          path: |
            dist-desktop/PRII-THEHUB-*.zip
            dist-desktop/PRII-THEHUB-*.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist-desktop/PRII-THEHUB-*.zip
            dist-desktop/PRII-THEHUB-*.dmg

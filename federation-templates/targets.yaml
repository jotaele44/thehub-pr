# Which canonical template renders to which path, in which repos.
# {{APP_SLUG}} in an output path is substituted per-repo from producers.vars.yaml.
# Verbatim templates carry no placeholder; slug-parameterized ones ({{APP_SLUG}})
# substitute in content too. requirements-desktop.txt is desktop-producers-only
# (spiderweb's desktop model differs; thehub keeps its own). The schema and
# Fix-Gatekeeper are byte-identical across all 7.
schema_version: prii_federation_template_targets_v1

_all: &all
  [aguayluz-pr, centinelas-pr, moneysweep-pr, ovnis-pr, skywatcher-pr, spiderweb-pr, thehub-pr]
# The shared launcher: thin scripts that find a Python and hand over to the
# shared desktop/setup.py, which does setup, start, repair, languages, options
# and preferences. Six of seven repos.
_launcher: &launcher
  [aguayluz-pr, centinelas-pr, ovnis-pr, skywatcher-pr, spiderweb-pr, thehub-pr]
# moneysweep-pr keeps the previous launchers (legacy/) and its own
# desktop/setup.py: that setup installs from an offline wheelhouse and a
# committed prebuilt dashboard and runs preflight checks, none of which the
# shared setup does yet. Rendering the shared one over it would break a working
# app, so it adopts later, once those features are generalised.
_legacy_launcher: &legacy_launcher
  [moneysweep-pr]
_desktop: &desktop
  [aguayluz-pr, centinelas-pr, moneysweep-pr, ovnis-pr, skywatcher-pr]
# moneysweep-pr keeps its own pip-audit workflow: it is tailored to that repo's
# requirements.lock and is referenced by docs/DEPENDENCY_SECURITY_AUDIT.md, so
# rendering over it would break a documented entry point.
_audit: &audit
  [aguayluz-pr, centinelas-pr, ovnis-pr, skywatcher-pr, spiderweb-pr, thehub-pr]
# moneysweep-pr and spiderweb-pr keep their own .pre-commit-config.yaml: both are
# tailored well beyond the shared baseline (registry-JSON regeneration and a
# narrow-scope blocking mypy gate in moneysweep; a release-check smoke and
# schema-validation hooks in spiderweb). Rendering over them would delete real
# repo-specific work.
_precommit: &precommit
  [aguayluz-pr, centinelas-pr, ovnis-pr, skywatcher-pr, thehub-pr]
# Governance. moneysweep-pr keeps its own SECURITY.md, CONTRIBUTING.md and
# CODE_OF_CONDUCT.md: they cite that repo's STATUS.md, reports/current_status.json,
# pinned tool versions and the requirements.in -> requirements.lock flow, none of
# which generalizes. Rendering over them would replace specific, true text with
# generic text.
_governance: &governance
  [aguayluz-pr, centinelas-pr, ovnis-pr, skywatcher-pr, spiderweb-pr, thehub-pr]
# CODEOWNERS and the PR template additionally exclude spiderweb-pr, whose
# versions encode real per-path review rules (schemas/, docs/contracts/, specific
# satellite tests) and a repo-specific test-plan checklist.
_review: &review
  [aguayluz-pr, centinelas-pr, ovnis-pr, skywatcher-pr, thehub-pr]
# Only the three repos that ship no LICENSE at all. The other four already have
# one and are left untouched — moneysweep-pr's uses contributor-inclusive
# wording that is deliberately not propagated.
_needs_license: &needs_license
  [ovnis-pr, skywatcher-pr, spiderweb-pr]
# The six producers, excluding thehub-pr — the hub already has its own server
# tests, and its backend is the one the producers' shells were modelled on. Also
# the audience of baseline/dependabot.yml, whose hub variant differs.
_producers: &producers
  [aguayluz-pr, centinelas-pr, moneysweep-pr, ovnis-pr, skywatcher-pr, spiderweb-pr]
# V2 grid consumers that are also producer repositories. Spiderweb is excluded:
# it owns the geometry contract rather than consuming a reference-only pin.
_grid_v2_producer_consumers: &grid_v2_producer_consumers
  [aguayluz-pr, centinelas-pr, moneysweep-pr, ovnis-pr, skywatcher-pr]
# The five producers whose frontends are React/JSX and share this lint surface.
# Optional source globs are safe when a producer lacks that directory and ensure
# archive-derived shipped shells cannot silently fall outside lint coverage.
# spiderweb-pr is excluded because its frontend is
# TypeScript — no src/pages/, no Layout.jsx, zero .jsx files — so this config's
# globs would match nothing there and produce a gate that lints no files at all.
# thehub-pr keeps its own variant, which additionally sets no-undef.
_jsx_frontend: &jsx_frontend
  [aguayluz-pr, centinelas-pr, moneysweep-pr, ovnis-pr, skywatcher-pr]
# GUI rules (docs/FEDERATION_GUI_STANDARD.md, ADR 0014). These two sets are the
# ADOPTION LISTS, not the eventual audience: a repository is added here by the
# hub change that starts its adoption, one repository at a time, because
# rendering the canonical checker over a producer's own copy before its manifest
# and fragments are ready would turn that producer's gate red. Until a repo is
# listed its own copies stand, and federation-template-sync.yml leaves them alone.
#   _gui_rules — checker, its test, the procedure document. Eventually all seven.
#   _gui_code  — the parity workflow. Eventually the five in _jsx_frontend;
#                thehub-pr keeps its own (its e2e mocks the API, with no backend
#                step) and spiderweb-pr keeps its runtime matrix.
# Adoption order: moneysweep-pr, centinelas-pr, then the rest.
# Adopted so far: thehub-pr (rules), moneysweep-pr (rules and workflow).
_gui_rules: &gui_rules
  [moneysweep-pr, thehub-pr]
_gui_code: &gui_code
  [moneysweep-pr]

targets:
  - template: Fix-Gatekeeper.command
    output: Fix-Gatekeeper.command
    repos: *all
  - template: PRII-APP.command
    output: PRII-{{APP_SLUG}}.command
    repos: *launcher
  - template: PRII-APP.bat
    output: PRII-{{APP_SLUG}}.bat
    repos: *launcher
  - template: PRII-APP.sh
    output: PRII-{{APP_SLUG}}.sh
    repos: *launcher
  # The two scripts inside the .app bundle. mode is required: the executable
  # has no suffix, so the renderer's .sh/.command extension rule cannot see it,
  # and a first render into a fresh checkout would leave it 0644 — a bundle
  # that will not launch while its content still compares equal.
  - template: PRII-APP.app/Contents/MacOS/PRII-APP
    output: PRII-{{APP_SLUG}}.app/Contents/MacOS/PRII-{{APP_SLUG}}
    repos: *launcher
    mode: 0755
  - template: PRII-APP.app/Contents/Resources/first-run-setup.command
    output: PRII-{{APP_SLUG}}.app/Contents/Resources/first-run-setup.command
    repos: *launcher
    mode: 0755
  # Setup, start and repair logic shared by every launcher above. Per-app
  # values stay in each repo's own desktop/config.py.
  - template: desktop/setup.py
    output: desktop/setup.py
    repos: *launcher
  # The previous launchers, for the one repo that has not adopted the shared
  # setup (see _legacy_launcher).
  - template: legacy/PRII-APP.command
    output: PRII-{{APP_SLUG}}.command
    repos: *legacy_launcher
  - template: legacy/PRII-APP.bat
    output: PRII-{{APP_SLUG}}.bat
    repos: *legacy_launcher
  - template: legacy/PRII-APP.sh
    output: PRII-{{APP_SLUG}}.sh
    repos: *legacy_launcher
  - template: legacy/PRII-APP.app/Contents/MacOS/PRII-APP
    output: PRII-{{APP_SLUG}}.app/Contents/MacOS/PRII-{{APP_SLUG}}
    repos: *legacy_launcher
    mode: 0755
  # A pip manifest: producers' Dependabot excludes it ({{RENDERED_PIP_MANIFESTS}}).
  # Keep the template directly in federation-templates/, where the hub's own pip
  # scan of "/" still reaches it and bumps pywebview here and in the hub's
  # requirements-desktop.txt together.
  - template: requirements-desktop.txt
    output: requirements-desktop.txt
    repos: *desktop
  - template: schemas/federation_export_manifest.schema.json
    output: schemas/federation_export_manifest.schema.json
    repos: *all

  # PR_GRID_GEOGRAPHIC_V2 consumer runtime. One implementation, two output
  # locations: producer-consumers keep it beside their pin; TheHub imports the
  # same bytes as a package module. Spiderweb remains the geometry authority.
  - template: spatial/pr_grid_v2_runtime.py
    output: federation/spatial/pr_grid_v2_runtime.py
    repos: *grid_v2_producer_consumers
  - template: spatial/pr_grid_v2_runtime.py
    output: src/hub/grid_v2.py
    repos: [thehub-pr]

  # V2 profiles are domain-owned. TheHub distributes the same immutable logic,
  # but never runs producer materialization or accepts geometry.
  - template: spatial/pr_grid_v2_profiles.py
    output: federation/spatial/pr_grid_v2_profiles.py
    repos: *grid_v2_producer_consumers
  - template: spatial/materialize_pr_grid_v2_profiles.py
    output: federation/spatial/materialize_pr_grid_v2_profiles.py
    repos: *grid_v2_producer_consumers

  - template: spatial/test_pr_grid_v2_profiles.py
    output: tests/test_pr_grid_v2_profiles.py
    repos: *grid_v2_producer_consumers
  - template: spatial/export_pr_grid_v2_exact_observations.py
    output: federation/spatial/export_pr_grid_v2_exact_observations.py
    repos: *grid_v2_producer_consumers
  - template: spatial/test_pr_grid_v2_source_export.py
    output: tests/test_pr_grid_v2_source_export.py
    repos: *grid_v2_producer_consumers

  # Engineering baseline — supply-chain and dependency hygiene that every repo
  # in the federation needs. Single-sourced here so a fix lands once instead of
  # seven times, and so template-drift.yml keeps it from rotting.
  # Dependabot comes in two variants that render to the same path. Producers
  # exclude the workflows and pip manifests rendered into them
  # ({{RENDERED_WORKFLOWS}}, {{RENDERED_PIP_MANIFESTS}}, both derived from this
  # file), because a version bumped in a rendered copy breaks their drift gate.
  # thehub-pr instead scans the templates themselves, so bumps land in the
  # template first and reach producers in a sync PR. See the README sections
  # "Action pins: Dependabot bumps the template, never a copy" and "Pip
  # manifests: the same rule for requirements-desktop.txt".
  - template: baseline/dependabot.yml
    output: .github/dependabot.yml
    repos: *producers
  - template: baseline/dependabot.hub.yml
    output: .github/dependabot.yml
    repos: [thehub-pr]
  - template: baseline/codeql.yml
    output: .github/workflows/codeql.yml
    repos: *all
  - template: baseline/secret-scan.yml
    output: .github/workflows/secret-scan.yml
    repos: *all
  - template: baseline/pip-audit.yml
    output: .github/workflows/pip-audit.yml
    repos: *audit
  - template: baseline/pre-commit-config.yaml
    output: .pre-commit-config.yaml
    repos: *precommit

  # Documentation stays true (ADR 0004 §Documentation drift, generalized). The
  # checker, its workflow, the agent-time Stop hook and the standing instruction
  # are the *rule*, so they are byte-identical everywhere. What differs per repo is
  # .federation/docs-sync.json (which docs cover which paths) and it is
  # deliberately NOT templated. The pre-commit hook, the CONTRIBUTING section and
  # the PR-template line ride in the existing baseline files above; moneysweep-pr
  # and spiderweb-pr keep their own copies of those and carry the same additions
  # by hand.
  - template: baseline/check_docs_sync.py
    output: tools/check_docs_sync.py
    repos: *all
  - template: baseline/docs-sync.yml
    output: .github/workflows/docs-sync.yml
    repos: *all
  - template: baseline/claude-settings.json
    output: .claude/settings.json
    repos: *all
  - template: baseline/CLAUDE.md
    output: CLAUDE.md
    repos: *all

  # Every producer ships a FastAPI backend at server/backend/main.py, and three
  # of them had no test importing it — an import-time break shipped green. The
  # test is byte-identical everywhere because /health is the only route all six
  # share; anything deeper belongs in the repo's own tests, not here.
  - template: baseline/test_server_smoke.py
    output: tests/test_server_smoke.py
    repos: *producers

  # The Launch Pad declaration check (prii_desktop >= 0.4.0). Every repo with a
  # desktop wrapper, the hub and spiderweb-pr included: it skips where there is
  # no desktop/config.py or the installed runtime predates the check, so it is
  # safe to render before a producer has adopted the Launch Pad.
  - template: baseline/test_launchpad_declaration.py
    output: tests/test_launchpad_declaration.py
    repos: *all

  # The frontend lint config. It stops shared lint coverage from drifting apart
  # and gives the CI lint gates a single source of truth.
  # {{FRONTEND_DIR}} rather than {{NPM_DIR}}: the latter carries a leading slash
  # for Dependabot, which would make `repo_root / rel` resolve absolute.
  - template: baseline/eslint.config.js
    output: "{{FRONTEND_DIR}}/eslint.config.js"
    repos: *jsx_frontend

  # GUI rules. One checker instead of five diverging copies; repo specifics live
  # in each repository's manifest `discovery` block, so the checker and its test
  # carry no placeholders. See the _gui_rules / _gui_code comment above before
  # adding a repository.
  - template: gui/check_gui_parity.py
    output: scripts/check_gui_parity.py
    repos: *gui_rules
  - template: gui/test_gui_parity.py
    output: tests/test_gui_parity.py
    repos: *gui_rules
  - template: gui/GUI_CAPABILITY_PARITY.md
    output: docs/GUI_CAPABILITY_PARITY.md
    repos: *gui_rules
  - template: gui/gui-capability-parity.yml
    output: .github/workflows/gui-capability-parity.yml
    repos: *gui_code

  # Governance and contributor surface. Shared because the quality gates became
  # uniform across the federation; anything repo-specific stays in README/docs.
  - template: baseline/SECURITY.md
    output: SECURITY.md
    repos: *governance
  - template: baseline/CODE_OF_CONDUCT.md
    output: CODE_OF_CONDUCT.md
    repos: *governance
  - template: baseline/CONTRIBUTING.md
    output: CONTRIBUTING.md
    repos: *governance
  - template: baseline/CODEOWNERS
    output: .github/CODEOWNERS
    repos: *review
  - template: baseline/pull_request_template.md
    output: .github/pull_request_template.md
    repos: *review
  - template: baseline/LICENSE
    output: LICENSE
    repos: *needs_license
  - template: baseline/ISSUE_TEMPLATE/config.yml
    output: .github/ISSUE_TEMPLATE/config.yml
    repos: *governance
  - template: baseline/ISSUE_TEMPLATE/bug_report.yml
    output: .github/ISSUE_TEMPLATE/bug_report.yml
    repos: *governance
  - template: baseline/ISSUE_TEMPLATE/feature_request.yml
    output: .github/ISSUE_TEMPLATE/feature_request.yml
    repos: *governance
  - template: baseline/ISSUE_TEMPLATE/improvement.yml
    output: .github/ISSUE_TEMPLATE/improvement.yml
    repos: *governance
  - template: baseline/ISSUE_TEMPLATE/question.yml
    output: .github/ISSUE_TEMPLATE/question.yml
    repos: *governance

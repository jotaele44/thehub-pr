# Per-producer template variables for the federation boilerplate renderer.
# The ONLY per-repo data needed to render the shared launcher/desktop/schema
# boilerplate and the engineering baseline. See tools/render_federation_templates.py.
#
#   app_slug — launcher/app naming (PRII-<SLUG>.command, etc.)
#   npm_dir  — the repo's single npm package root, for Dependabot's npm
#              ecosystem. Each repo has exactly one committed package-lock.json;
#              the path differs because the frontends grew independently
#              (dashboard/ vs frontend/ vs server/frontend/).
schema_version: prii_federation_template_vars_v1
producers:
  aguayluz-pr:   { app_slug: AGUAYLUZ,   npm_dir: /dashboard }
  centinelas-pr: { app_slug: CENTINELAS, npm_dir: /frontend }
  moneysweep-pr: { app_slug: MONEYSWEEP, npm_dir: /dashboard }
  ovnis-pr:      { app_slug: OVNIS,      npm_dir: /dashboard }
  skywatcher-pr: { app_slug: SKYWATCHER, npm_dir: /frontend }
  spiderweb-pr:  { app_slug: SPIDERWEB,  npm_dir: /server/frontend }
  thehub-pr:     { app_slug: THEHUB,     npm_dir: /server/frontend }

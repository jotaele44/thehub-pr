[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "thehub-pr"
version = "0.1.0"
description = "PRII federation Hub — producer registry, conformance validation, and aggregation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  # >=4.18 for the `referencing` registry (RefResolver is deprecated).
  "jsonschema>=4.18",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# ruff and mypy carry upper bounds on purpose: both ship new diagnostics in minor
# releases, and CI installs this extra with pip (not from uv.lock), so an unbounded
# range lets an upstream release turn `main` red with no change here. Dependabot
# raises the bound in a reviewable PR instead.
dev = ["pytest>=7.0", "pytest-cov>=5", "ruff>=0.4,<0.17", "mypy>=1.10,<2.4", "types-PyYAML", "httpx2"]
server = ["fastapi>=0.100", "uvicorn[standard]>=0.22", "cryptography>=41"]

[project.scripts]
hub = "hub.cli:main"
fed = "fed_entry:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# Matches the floor (`requires-python = ">=3.10"`). DEP-2
# (handoff-audit/upgrade-audit/UPGRADE_AUDIT.md) is resolved: the floor used
# to be 3.9, which current mypy can no longer target, so mypy and the floor
# disagreed. Raising the floor to 3.10 removed that gap.
python_version = "3.10"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.coverage.run]
branch = true
source = ["src/hub"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
# Ratchet, not a target. Scoped to src/hub (the packaged library) rather than the
# whole tree, so the number tracks the code this repo actually owns; the
# self-contained sub-projects under packages/ have their own CI jobs.
# Floor set below the measured value so normal variation across the CI Python
# matrix (3.10-3.12) does not cause false failures. Raise it as coverage
# improves; never lower it to make a build pass. 91% measured when this landed.
fail_under = 88
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "thehub-pr"
version = "0.1.0"
description = "PRII federation Hub — producer registry, conformance validation, and aggregation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "jsonschema>=4.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=5", "ruff>=0.4", "mypy>=1.10", "types-PyYAML"]
server = ["fastapi>=0.100", "uvicorn[standard]>=0.22", "cryptography>=41"]

[project.scripts]
hub = "hub.cli:main"
fed = "fed_entry:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# NOTE (DEP-2, handoff-audit/upgrade-audit/UPGRADE_AUDIT.md): this repo's floor
# is `requires-python = ">=3.9"` (exercised for real in ci.yml's test matrix),
# but the currently resolved mypy (>=1.10, floating) has dropped support for
# `python_version = "3.9"` entirely — it now hard-requires 3.10+ and ignores a
# 3.9 setting with a warning rather than checking 3.9 semantics. So "align
# mypy to the floor" is no longer achievable by changing this value; the
# floor's actual 3.9-compatibility guarantee rests on the CI matrix's real
# 3.9 test run, not on mypy. Fixing this for real means either pinning an
# older mypy that still supports a 3.9 target, or raising requires-python to
# 3.10 (which would also mean dropping 3.9 from the CI matrix) — both are
# bigger, deliberate decisions than a config-only pass, so left for a
# follow-up rather than done here.
python_version = "3.10"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.coverage.run]
branch = true
source = ["src/hub"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
# Ratchet, not a target. Scoped to src/hub (the packaged library) rather than the
# whole tree, so the number tracks the code this repo actually owns; the
# self-contained sub-projects under packages/ have their own CI jobs.
# Floor set below the measured value so normal variation across the CI Python
# matrix (3.9-3.12) does not cause false failures. Raise it as coverage
# improves; never lower it to make a build pass. 91% measured when this landed.
fail_under = 88
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
